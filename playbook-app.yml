- name: Deploy log analyzer
  hosts: rke2_servers
  become: true
  vars_files:
    - vars/app.yml
  vars:
    kubectl: /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml
    manifest_dir: /opt/log-analyzer/manifests
  tasks:
    - name: Clear previously rendered manifests
      ansible.builtin.file:
        path: "{{ manifest_dir }}"
        state: absent

    - name: Create manifest folder
      ansible.builtin.file:
        path: "{{ manifest_dir }}"
        state: directory
        mode: "0755"

    - name: Render manifests onto the server node
      ansible.builtin.template:
        src: "{{ item }}"
        dest: "{{ manifest_dir }}/{{ item | basename }}"
        mode: "0644"
      loop: "{{ query('fileglob', playbook_dir ~ '/manifests/*.yml') | sort }}"

    - name: Apply manifests
      ansible.builtin.command: "{{ kubectl }} apply -f {{ manifest_dir }}"
      register: app_apply
      changed_when: "'created' in app_apply.stdout or 'configured' in app_apply.stdout"

    - name: Print apply output
      ansible.builtin.debug:
        var: app_apply.stdout_lines

    - name: Wait for every rollout in the namespace
      ansible.builtin.shell: |
        for r in $({{ kubectl }} -n {{ app_namespace }} get statefulset,deployment -o name); do
          {{ kubectl }} -n {{ app_namespace }} rollout status "$r" --timeout=180s || exit 1
        done
      args:
        executable: /bin/bash
      changed_when: false
