apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: storage
  namespace: {{ app_namespace }}
spec:
  serviceName: storage
  replicas: {{ replicas.storage }}
  selector:
    matchLabels:
      app: storage
  template:
    metadata:
      labels:
        app: storage
    spec:
      containers:
        - name: storage
          image: "{{ image_repo }}:storage-{{ image_tag_storage }}"
          ports:
            - containerPort: {{ ports.storage }}
          env:
            - name: DB_PATH
              value: /data/alerts.db
          envFrom:
            - configMapRef:
                name: log-analyzer-config
          volumeMounts:
            - name: data
              mountPath: /data
    volumeClaimTemplates:
      - metadata:
          name: data
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 1Gi
---
apiVersion: v1
kind: service
metadata: 
  name: storage
  namespace: {{ app_namespace }}
spec:
  type: CluserIP
  selector:
    app: storage
  ports:
    - port: {{ ports.storage }}
      targetPort: {{ ports.storage }}